<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SEOULDROP | K-POP SHOP</title>

<style>
:root{
  --bg:#050308;
  --panel:#0e0912;
  --panel2:#160d1b;
  --pink:#ff4fb3;
  --pink2:#ff91d1;
  --violet:#a76cff;
  --text:#fff7fc;
  --muted:#bcaabd;
  --line:rgba(255,111,194,.18)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 15% 5%,
      rgba(255,79,179,.14),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(167,108,255,.14),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    sans-serif;
}

button{
  font:inherit
}

.app{
  max-width:760px;
  margin:auto;
  padding:16px 14px 92px
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px
}

.brand img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 22px rgba(255,79,179,.38)
}

.brand b{
  font-size:16px;
  letter-spacing:.14em
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px
}

.icon{
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  border-radius:14px;
  padding:10px 12px;
  cursor:pointer
}

.hero{
  border:1px solid var(--line);
  border-radius:26px;
  padding:24px 20px;
  background:
    linear-gradient(
      135deg,
      rgba(255,79,179,.12),
      rgba(167,108,255,.08) 55%,
      rgba(0,0,0,.2)
    )
}

.hero h1{
  margin:0;
  font-size:28px;
  line-height:1.05;
  max-width:420px
}

.hero p{
  color:var(--muted);
  max-width:430px;
  margin:10px 0 16px
}

.cta{
  background:
    linear-gradient(
      90deg,
      var(--pink),
      var(--violet)
    );
  border:0;
  color:white;
  font-weight:800;
  border-radius:14px;
  padding:12px 18px;
  box-shadow:0 8px 28px rgba(255,79,179,.25);
  cursor:pointer
}

.section{
  margin-top:22px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.section h2{
  font-size:18px;
  margin:0
}

.categories{
  display:flex;
  gap:9px;
  overflow:auto;
  padding-bottom:3px
}

.cat{
  white-space:nowrap;
  background:var(--panel);
  border:1px solid var(--line);
  color:#fbeaf6;
  border-radius:999px;
  padding:9px 13px;
  cursor:pointer
}

.cat.active{
  background:rgba(255,79,179,.15);
  border-color:rgba(255,145,209,.55);
  color:#fff
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:12px
}

.card{
  background:
    linear-gradient(
      180deg,
      var(--panel2),
      var(--panel)
    );
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden
}

.pic{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle,
      rgba(255,79,179,.18),
      transparent 52%
    ),
    #09050b
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:12px
}

.info{
  padding:12px
}

.name{
  font-weight:750;
  font-size:14px;
  min-height:38px
}

.meta{
  color:var(--muted);
  font-size:11px;
  margin:4px 0 9px
}

.price{
  font-size:17px;
  font-weight:850
}

.status{
  font-size:12px;
  margin-top:5px;
  min-height:18px
}

.status.green{
  color:#53e69a
}

.status.yellow{
  color:#ffd34d
}

.status.red{
  color:#ff667f
}

.add{
  width:100%;
  margin-top:9px;
  border:1px solid rgba(255,145,209,.32);
  background:rgba(255,79,179,.1);
  color:#fff;
  border-radius:12px;
  padding:9px;
  cursor:pointer
}

.add.preorder{
  background:rgba(255,211,77,.10);
  border-color:rgba(255,211,77,.35)
}

.add.disabled{
  opacity:.45;
  cursor:not-allowed
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted)
}

.loading{
  padding:30px 15px;
  text-align:center;
  color:var(--muted)
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 14px;
  background:rgba(5,3,8,.84);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line)
}

.bottom-inner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:8px
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  font-size:11px;
  cursor:pointer
}

.nav.active{
  color:#fff
}

.nav strong{
  display:block;
  font-size:19px;
  margin-bottom:2px
}

.badge{
  display:inline-flex;
  min-width:18px;
  height:18px;
  border-radius:9px;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  font-size:10px;
  margin-left:3px
}

@media(min-width:650px){
  .grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr))
  }

  .pic{
    height:190px
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div>
      <b>SEOULDROP</b>

      <span>
        K-POP SHOP
      </span>
    </div>

  </div>

  <button
    class="icon"
    onclick="loadProducts()"
  >
    ↻
  </button>

</header>


<section class="hero">

  <h1>
    Твой K-POP из Кореи 🇰🇷
  </h1>

  <p>
    Альбомы, photocards и оригинальный merch —
    выбирай любимых артистов и собирай свою коллекцию.
  </p>

  <button
    class="cta"
    onclick="
      document
        .getElementById('catalog')
        .scrollIntoView({behavior:'smooth'})
    "
  >
    Смотреть каталог
  </button>

</section>


<section
  class="section"
  id="catalog"
>

  <div class="section-head">

    <h2>
      Каталог
    </h2>

    <span
      class="muted"
      id="productCount"
    >
      Загрузка...
    </span>

  </div>


  <div
    class="categories"
    id="categories"
  >

    <button
      class="cat active"
      data-category="all"
    >
      Все
    </button>

    <button
      class="cat"
      data-category="albums"
    >
      💿 Альбомы
    </button>

    <button
      class="cat"
      data-category="photocards"
    >
      🃏 Photocards
    </button>

    <button
      class="cat"
      data-category="merch"
    >
      🎁 Merch
    </button>

    <button
      class="cat"
      data-category="cosmetics"
    >
      🧴 Косметика
    </button>

    <button
      class="cat"
      data-category="sweets"
    >
      🍪 Сладости
    </button>

  </div>


  <div
    id="products"
    class="grid"
    style="margin-top:12px"
  >

    <div class="loading">
      Загружаем каталог...
    </div>

  </div>

</section>

</div>


<nav class="bottom">

  <div class="bottom-inner">

    <button
      class="nav active"
      onclick="
        window.scrollTo({
          top:0,
          behavior:'smooth'
        })
      "
    >
      <strong>⌂</strong>
      Главная
    </button>


    <button
      class="nav"
      onclick="
        document
          .getElementById('catalog')
          .scrollIntoView({
            behavior:'smooth'
          })
      "
    >
      <strong>◈</strong>
      Каталог
    </button>


    <button
      class="nav"
      onclick="showCart()"
    >
      <strong>
        🛒
        <span
          class="badge"
          id="navCount"
        >
          0
        </span>
      </strong>
      Корзина
    </button>

  </div>

</nav>


<script>

let products = [];

let cart = 0;

let currentCategory = "all";


/* ЗАГРУЗКА ТОВАРОВ */

async function loadProducts(){

  const box =
    document.getElementById(
      "products"
    );

  box.innerHTML =
    '<div class="loading">Загружаем каталог...</div>';

  try{

    const response =
      await fetch(
        "/api/products?action=list",
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !data.ok ||
      !Array.isArray(data.products)
    ){

      throw new Error(
        "Не удалось загрузить каталог"
      );

    }

    products =
      data.products;

    renderProducts();

  }catch(error){

    console.error(error);

    box.innerHTML =
      `
      <div class="empty">
        Не удалось загрузить каталог.<br>
        Попробуйте обновить страницу.
      </div>
      `;

  }

}


/* СТАТУС */

function getStatus(product){

  if(product.status){

    return product.status;

  }

  if(
    product.available === false
  ){

    return "out_of_stock";

  }

  return "in_stock";

}


/* ТЕКСТ СТАТУСА */

function getStatusText(product){

  const status =
    getStatus(product);

  if(
    status === "preorder"
  ){

    return "🟡 Под заказ";

  }

  if(
    status === "out_of_stock"
  ){

    return "🔴 Нет в наличии";

  }

  return "🟢 В наличии";

}


/* КАТЕГОРИЯ */

function categoryName(category){

  const names = {

    albums:"Альбом",

    photocards:"Photocards",

    merch:"Merch",

    cosmetics:"Косметика",

    sweets:"Сладости"

  };

  return names[category]
    || category
    || "Товар";

}


/* ОТРИСОВКА */

function renderProducts(){

  const box =
    document.getElementById(
      "products"
    );

  const filtered =
    products.filter(product => {

      if(
        currentCategory === "all"
      ){

        return true;

      }

      return (
        product.category ===
        currentCategory
      );

    });


  document
    .getElementById(
      "productCount"
    )
    .textContent =
    products.length +
    " товар" +
    (
      products.length === 1
        ? ""
        : "а"
    );


  if(!filtered.length){

    box.innerHTML =
      `
      <div class="empty">
        В этой категории пока нет товаров.
      </div>
      `;

    return;

  }


  box.innerHTML = "";


  filtered.forEach(product => {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "card";


    const status =
      getStatus(product);


    let buttonText =
      "＋ В корзину";


    let buttonClass =
      "add";


    let disabled =
      "";


    if(
      status === "preorder"
    ){

      buttonText =
        "＋ Заказать";

      buttonClass =
        "add preorder";

    }


    if(
      status === "out_of_stock"
    ){

      buttonText =
        "Нет в наличии";

      buttonClass =
        "add disabled";

      disabled =
        "disabled";

    }


    const image =
      product.image
        ? product.image
        : "";


    card.innerHTML = `

      <div class="pic">

        ${
          image
            ? `
              <img
                src="${image}"
                alt="${esc(
                  product.name
                )}"
              >
            `
            : `
              <div
                style="
                  color:var(--muted);
                  font-size:12px
                "
              >
                SEOULDROP
              </div>
            `
        }

      </div>


      <div class="info">

        <div class="name">
          ${esc(
            product.name
          )}
        </div>


        <div class="meta">

          ${esc(
            categoryName(
              product.category
            )
          )}

        </div>


        <div class="price">

          ${Number(
            product.price || 0
          ).toLocaleString(
            "ru-RU"
          )} ₽

        </div>


        <div
          class="status ${
            status === "in_stock"
              ? "green"
              : status === "preorder"
                ? "yellow"
                : "red"
          }"
        >

          ${getStatusText(
            product
          )}

        </div>


        <button
          class="${buttonClass}"
          ${disabled}
          onclick="
            addToCart(
              '${String(
                product.id || ""
              ).replace(
                /'/g,
                "\\'"
              )}'
            )
          "
        >

          ${buttonText}

        </button>

      </div>

    `;


    box.appendChild(card);

  });

}


/* ДОБАВИТЬ В КОРЗИНУ */

function addToCart(id){

  const product =
    products.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!product){

    return;

  }


  const status =
    getStatus(product);


  if(
    status === "out_of_stock"
  ){

    return;

  }


  cart++;


  document
    .getElementById(
      "navCount"
    )
    .textContent =
    cart;


  if(
    status === "preorder"
  ){

    alert(
      "🟡 " +
      product.name +
      "\n\nТовар под заказ."
    );

  }else{

    alert(
      "🛒 " +
      product.name +
      "\n\nТовар добавлен в корзину."
    );

  }

}


/* КОРЗИНА */

function showCart(){

  if(cart){

    alert(
      "🛒 В корзине: " +
      cart +
      " товар(а)."
    );

  }else{

    alert(
      "Корзина пока пуста."
    );

  }

}


/* КАТЕГОРИИ */

document
  .querySelectorAll(".cat")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(
            ".cat"
          )
          .forEach(item =>
            item.classList.remove(
              "active"
            )
          );


        this.classList.add(
          "active"
        );


        currentCategory =
          this.dataset.category;


        renderProducts();

      }
    );

  });


/* ЗАЩИТА ОТ HTML */

function esc(value){

  return String(
    value || ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );

}


/* СТАРТ */

loadProducts();

</script>

</body>
</html>
