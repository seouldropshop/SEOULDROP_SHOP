<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SEOULDROP | K-POP SHOP</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#050308;
  --panel:#0e0912;
  --panel2:#160d1b;
  --pink:#ff4fb3;
  --pink2:#ff91d1;
  --violet:#a76cff;
  --text:#fff7fc;
  --muted:#bcaabd;
  --line:rgba(255,111,194,.18);
  --green:#5be49b;
  --yellow:#ffd65a;
  --red:#ff637c;
}

*{box-sizing:border-box}

html{background:var(--bg)}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 5%,rgba(255,79,179,.14),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(167,108,255,.14),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}

.app{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:16px 14px 100px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-logo{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 22px rgba(255,79,179,.38);
  background:#120914;
}

.brand-text{min-width:0}

.brand-text b{
  display:block;
  font-size:16px;
  letter-spacing:.14em;
  white-space:nowrap;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.header-button{
  position:relative;
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  border-radius:14px;
  width:46px;
  height:46px;
  cursor:pointer;
  font-size:20px;
}

.favorite-top{
  font-size:21px;
}

.cart-badge,
.favorite-badge{
  position:absolute;
  right:-4px;
  top:-5px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:10px;
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  color:#fff;
  font-size:10px;
  font-weight:800;
}

/* HERO */

.hero{
  border:1px solid var(--line);
  border-radius:26px;
  padding:24px 20px;
  background:
    linear-gradient(
      135deg,
      rgba(255,79,179,.12),
      rgba(167,108,255,.08) 55%,
      rgba(0,0,0,.2)
    );
}

.hero h1{
  margin:0;
  font-size:28px;
  line-height:1.05;
}

.hero p{
  color:var(--muted);
  max-width:470px;
  margin:10px 0 16px;
  line-height:1.5;
  font-size:14px;
}

.cta{
  background:linear-gradient(90deg,var(--pink),var(--violet));
  border:0;
  color:#fff;
  font-weight:800;
  border-radius:14px;
  padding:12px 18px;
  box-shadow:0 8px 28px rgba(255,79,179,.25);
  cursor:pointer;
}

/* SEARCH */

.search{margin-top:18px}

.search-input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  background:rgba(14,9,18,.9);
  color:#fff;
  border-radius:15px;
  outline:none;
  padding:0 15px;
}

.search-input::placeholder{color:#8e7d8d}

/* SECTIONS */

.section{margin-top:22px}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section h2{
  font-size:18px;
  margin:0;
}

.product-count{
  color:var(--muted);
  font-size:11px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.cat{
  white-space:nowrap;
  background:var(--panel);
  border:1px solid var(--line);
  color:#fbeaf6;
  border-radius:999px;
  padding:9px 13px;
  cursor:pointer;
}

.cat.active{
  background:rgba(255,79,179,.15);
  border-color:rgba(255,145,209,.55);
  color:#fff;
}

/* PRODUCTS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.card{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,79,179,.045) 45%,
      rgba(167,108,255,.035)
    ),
    var(--panel);
  border:1px solid rgba(255,145,209,.18);
  border-radius:22px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:
    0 8px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.035);
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.card:active{
  transform:scale(.985);
}

.card:hover{
  border-color:rgba(255,145,209,.38);
  box-shadow:
    0 12px 38px rgba(0,0,0,.34),
    0 0 24px rgba(255,79,179,.08);
}

/* PRODUCT PHOTO */

.pic{
  position:relative;
  height:205px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,79,179,.18),
      transparent 48%
    ),
    radial-gradient(
      circle at 80% 20%,
      rgba(167,108,255,.12),
      transparent 40%
    ),
    #09050b;
  overflow:hidden;
}

.pic:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      transparent 55%,
      rgba(0,0,0,.18)
    );
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:9px;
  transition:transform .25s ease;
  position:relative;
  z-index:1;
}

.card:hover .pic img{
  transform:scale(1.035);
}

/* FAVORITE */

.favorite-button{
  position:absolute;
  top:9px;
  right:9px;
  z-index:10;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,3,8,.68);
  backdrop-filter:blur(8px);
  color:#fff;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .18s ease,
    background .18s ease;
}

.favorite-button:active{
  transform:scale(.88);
}

.favorite-button.active{
  background:rgba(255,79,179,.2);
  border-color:rgba(255,145,209,.5);
  color:var(--pink2);
}

/* PHOTO ARROWS */

.photo-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:31px;
  height:31px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,3,8,.68);
  backdrop-filter:blur(8px);
  color:#fff;
  z-index:5;
  cursor:pointer;
  font-size:20px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.photo-arrow.left{left:8px}
.photo-arrow.right{right:8px}

/* PHOTO DOTS */

.photo-dots{
  position:absolute;
  bottom:8px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:5;
}

.photo-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.38);
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}

.photo-dot.active{
  background:#fff;
  transform:scale(1.15);
}

/* PRODUCT INFO */

.info{
  padding:13px 13px 14px;
}

.name{
  font-weight:800;
  font-size:14px;
  min-height:38px;
  line-height:1.35;
  letter-spacing:-.01em;
}

.meta{
  color:var(--muted);
  font-size:10px;
  margin:5px 0 9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.price{
  display:inline-flex;
  align-items:center;
  font-size:19px;
  font-weight:900;
  letter-spacing:-.02em;
  margin-bottom:2px;
}

.description{
  color:#cbb7c7;
  font-size:11px;
  line-height:1.45;
  margin-top:7px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.more-description{
  display:inline-block;
  margin-top:5px;
  padding:0;
  border:0;
  background:none;
  color:var(--pink2);
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

/* STOCK BADGE */

.status{
  display:inline-flex;
  align-items:center;
  width:max-content;
  max-width:100%;
  margin-top:8px;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:750;
  line-height:1;
  border:1px solid transparent;
}

.status.instock{
  color:var(--green);
  background:rgba(91,228,155,.08);
  border-color:rgba(91,228,155,.16);
}

.status.preorder{
  color:var(--yellow);
  background:rgba(255,214,90,.08);
  border-color:rgba(255,214,90,.16);
}

.status.out{
  color:var(--red);
  background:rgba(255,99,124,.08);
  border-color:rgba(255,99,124,.16);
}

/* ADD */

.add{
  width:100%;
  margin-top:10px;
  border:1px solid rgba(255,145,209,.28);
  background:
    linear-gradient(
      135deg,
      rgba(255,79,179,.17),
      rgba(167,108,255,.11)
    );
  color:#fff;
  border-radius:13px;
  padding:10px 9px;
  cursor:pointer;
  font-weight:800;
  font-size:12px;
  transition:
    background .18s ease,
    transform .18s ease,
    border-color .18s ease;
}

.add:active{
  transform:scale(.98);
}

.add:not(.disabled):hover{
  background:
    linear-gradient(
      135deg,
      rgba(255,79,179,.28),
      rgba(167,108,255,.2)
    );
  border-color:rgba(255,145,209,.5);
}

.add.disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* MESSAGE */

.message{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  padding:25px 18px;
  text-align:center;
  color:var(--muted);
  line-height:1.5;
}

.message strong{color:#fff}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  padding:10px 14px;
  background:rgba(5,3,8,.88);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}

.bottom-inner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  font-size:11px;
  cursor:pointer;
}

.nav.active{color:#fff}

.nav strong{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.badge{
  display:inline-flex;
  min-width:18px;
  height:18px;
  border-radius:9px;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  font-size:10px;
  margin-left:3px;
}

/* MODALS */

.modal,
.product-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);
  align-items:flex-end;
  justify-content:center;
}

.modal.show,
.product-modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:760px;
  max-height:90vh;
  overflow:auto;
  background:linear-gradient(180deg,#170d1c,#09050c);
  border-radius:24px 24px 0 0;
  border:1px solid var(--line);
  padding:18px;
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.sheet-title{
  font-size:18px;
  font-weight:800;
}

.close{
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:22px;
  cursor:pointer;
}

/* FULL PRODUCT */

.product-modal{
  z-index:115;
}

.product-sheet{
  width:100%;
  max-width:760px;
  max-height:94vh;
  overflow:auto;
  background:linear-gradient(180deg,#170d1c,#09050c);
  border-radius:26px 26px 0 0;
  border:1px solid var(--line);
  padding:16px;
}

.product-photo{
  position:relative;
  width:100%;
  height:360px;
  border-radius:20px;
  overflow:hidden;
  background:
    radial-gradient(circle,rgba(255,79,179,.18),transparent 55%),
    #09050b;
}

.product-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:12px;
}

.product-photo-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:26px;
  z-index:3;
}

.product-photo-arrow.left{left:10px}
.product-photo-arrow.right{right:10px}

.product-photo-dots{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
}

.product-photo-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}

.product-photo-dot.active{background:#fff}

.product-info{
  padding:16px 4px 4px;
}

.product-title{
  font-size:23px;
  line-height:1.25;
  font-weight:850;
}

.product-category{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

.product-price{
  font-size:25px;
  font-weight:900;
  margin-top:12px;
}

.product-status{
  margin-top:7px;
  font-size:13px;
}

.product-full-description{
  margin-top:16px;
  color:#e8dbe5;
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
}

.product-add{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:15px;
  padding:14px;
  color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  font-size:15px;
  font-weight:850;
}

.product-add:disabled{opacity:.45}

.product-close{
  width:100%;
  margin-top:9px;
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  border-radius:14px;
  padding:12px;
}

/* FAVORITES MODAL */

.favorite-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.02);
  margin-bottom:9px;
}

.favorite-thumb{
  width:62px;
  height:62px;
  border-radius:12px;
  object-fit:contain;
  background:#09050b;
  flex-shrink:0;
}

.favorite-item-info{
  flex:1;
  min-width:0;
}

.favorite-item-name{
  font-size:13px;
  font-weight:750;
  line-height:1.35;
}

.favorite-item-price{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.favorite-remove{
  border:0;
  background:none;
  color:var(--pink2);
  font-size:20px;
  cursor:pointer;
  padding:6px;
}

/* GALLERY */

.gallery-modal{
  position:fixed;
  inset:0;
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.94);
}

.gallery-modal.show{display:flex}

.gallery-inner{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.gallery-image{
  max-width:94%;
  max-height:84%;
  object-fit:contain;
}

.gallery-close{
  position:absolute;
  top:18px;
  right:18px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:24px;
}

.gallery-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:22px;
}

.gallery-arrow.left{left:14px}
.gallery-arrow.right{right:14px}

/* CART */

.cart-items{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.cart-item{
  display:grid;
  grid-template-columns:64px 1fr auto;
  gap:10px;
  align-items:center;
  padding:10px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.02);
}

.cart-thumb{
  width:64px;
  height:64px;
  border-radius:11px;
  object-fit:cover;
  background:#09050b;
}

.cart-name{
  font-size:13px;
  font-weight:700;
}

.cart-price{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
}

.qty button{
  width:28px;
  height:28px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
}

.remove{
  border:0;
  background:none;
  color:var(--red);
  font-size:11px;
  margin-top:4px;
}

.cart-total{
  margin-top:16px;
  padding-top:15px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  font-size:17px;
  font-weight:800;
}

.checkout{
  width:100%;
  margin-top:14px;
  border:0;
  border-radius:14px;
  padding:13px;
  color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  font-weight:800;
}

.checkout:disabled{opacity:.45}

/* FORM */

.form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.form label{
  color:var(--muted);
  font-size:11px;
}

.form input,
.form textarea{
  width:100%;
  border:1px solid var(--line);
  background:#0d0811;
  color:#fff;
  border-radius:12px;
  padding:12px;
  outline:none;
}

.form textarea{
  min-height:90px;
  resize:vertical;
}

.success{
  text-align:center;
  padding:30px 10px;
}

.success-icon{
  font-size:48px;
  margin-bottom:12px;
}

/* MOBILE */

@media(max-width:420px){

  .grid{
    gap:10px;
  }

  .pic{
    height:185px;
  }

  .info{
    padding:11px;
  }

  .name{
    font-size:13px;
  }

  .price{
    font-size:17px;
  }

  .add{
    padding:9px 7px;
    font-size:11px;
  }

  .favorite-button{
    width:34px;
    height:34px;
    font-size:18px;
  }

}

/* TABLET / DESKTOP */

@media(min-width:650px){

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
  }

  .pic{
    height:205px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">

<img
class="brand-logo"
src="https://raw.githubusercontent.com/seouldropshop/SEOULDROP_SHOP/main/logo.png"
alt="SEOULDROP"
onerror="this.style.display='none'"
>

<div class="brand-text">
<b>SEOULDROP</b>
<span>K-POP SHOP 🇰🇷</span>
</div>

</div>

<div class="header-actions">

<button
class="header-button favorite-top"
type="button"
onclick="openFavorites()"
>
❤️
<span
id="favoriteBadge"
class="favorite-badge"
>0</span>
</button>

<button
class="header-button"
type="button"
onclick="openCart()"
