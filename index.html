<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOULDROP | К-ПОП МАГАЗИН</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#050308;
  --panel:#0e0912;
  --panel2:#160d1b;
  --pink:#ff4fb3;
  --violet:#a76cff;
  --text:#fff7fc;
  --muted:#bcaabd;
  --line:rgba(255,111,194,.18);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 5%,rgba(255,79,179,.14),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(167,108,255,.14),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding:16px 14px 92px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.brand b{
  font-size:16px;
  letter-spacing:.14em;
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.icon,
.cat,
.nav,
.add,
.qty button,
.close{
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  border-radius:14px;
}

.icon{
  padding:10px 12px;
}

.hero{
  border:1px solid var(--line);
  border-radius:26px;
  padding:24px 20px;
  background:linear-gradient(
    135deg,
    rgba(255,79,179,.12),
    rgba(167,108,255,.08) 55%,
    rgba(0,0,0,.2)
  );
}

.hero h1{
  margin:0;
  font-size:28px;
  line-height:1.05;
}

.hero p{
  color:var(--muted);
  max-width:430px;
  margin:10px 0 16px;
}

.cta,
.submit{
  background:linear-gradient(90deg,var(--pink),var(--violet));
  border:0;
  color:#fff;
  font-weight:800;
  border-radius:14px;
  padding:12px 18px;
}

.section{
  margin-top:22px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section h2{
  font-size:18px;
  margin:0;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.search-wrap{
  margin:0 0 14px;
}

.search-input{
  width:100%;
  padding:12px 15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#fff;
  outline:none;
  font-size:15px;
}

.search-input::placeholder{
  color:rgba(255,255,255,.55);
}

.categories{
  display:flex;
  gap:9px;
  overflow:auto;
  padding-bottom:3px;
}

.cat{
  white-space:nowrap;
  padding:9px 13px;
}

.cat.active{
  background:rgba(255,79,179,.15);
  border-color:rgba(255,145,209,.55);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:12px;
}

.card{
  background:linear-gradient(
    180deg,
    var(--panel2),
    var(--panel)
  );
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden;
}

.pic{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:
    radial-gradient(
      circle,
      rgba(255,79,179,.18),
      transparent 52%
    ),
    #09050b;
  touch-action:pan-y;
  user-select:none;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:12px;
}

.placeholder{
  font-size:48px;
}

.info{
  padding:12px;
}

.name{
  font-weight:750;
  font-size:14px;
  line-height:1.3;
}

.meta{
  color:var(--muted);
  font-size:11px;
  margin:4px 0 7px;
}

/* ОПИСАНИЕ В КАРТОЧКЕ */

.description{
  color:#d8c5d5;
  font-size:12px;
  line-height:1.45;
  margin:0 0 9px;
  white-space:pre-wrap;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:5;
  overflow:hidden;
}

.price{
  font-size:17px;
  font-weight:850;
}

.status{
  font-size:12px;
  margin-top:5px;
  min-height:18px;
}

.green{
  color:#53e69a;
}

.yellow{
  color:#ffd34d;
}

.red{
  color:#ff667f;
}

.add{
  width:100%;
  margin-top:9px;
  padding:9px;
  background:rgba(255,79,179,.1);
  border-color:rgba(255,145,209,.32);
}

.add.preorder{
  background:rgba(255,211,77,.1);
  border-color:rgba(255,211,77,.35);
}

.add.disabled{
  opacity:.45;
  cursor:not-allowed;
}

.empty,
.loading{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

.gallery-dots{
  position:absolute;
  bottom:8px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:6px;
  z-index:3;
  pointer-events:none;
}

.gallery-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
}

.gallery-dot.active{
  background:#fff;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 14px;
  background:rgba(5,3,8,.9);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:20;
}

.bottom-inner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  font-size:11px;
}

.nav.active{
  color:#fff;
}

.nav strong{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.badge{
  display:inline-flex;
  min-width:18px;
  height:18px;
  border-radius:9px;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  font-size:10px;
  margin-left:3px;
}

.overlay,
.description-modal,
.gallery-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:50;
  align-items:flex-end;
  justify-content:center;
}

.overlay.open,
.description-modal.show,
.gallery-modal.show{
  display:flex;
}

.sheet,
.description-sheet{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0c0710;
  border:1px solid var(--line);
  border-radius:24px 24px 0 0;
  padding:18px 16px 28px;
}

.sheet-head,
.description-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sheet h2{
  margin:0;
}

.close,
.description-close{
  padding:8px 12px;
}

.description-modal{
  z-index:10000;
}

.description-sheet{
  max-height:85vh;
}

.description-title{
  font-size:20px;
  font-weight:850;
}

.description-text{
  margin-top:16px;
  color:#d8c5d5;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.cart-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.cart-name{
  font-weight:700;
}

.cart-price{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.cart-stock{
  color:#53e69a;
  font-size:11px;
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:32px;
  height:32px;
  border-radius:10px;
}

.qty button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.telegram-line{
  background:rgba(167,108,255,.10);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  color:#fff;
  font-size:13px;
  margin-bottom:2px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:850;
  padding:16px 0;
}

.checkout{
  display:grid;
  gap:10px;
}

.checkout input,
.checkout textarea{
  width:100%;
  background:#09050b;
  color:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  outline:none;
}

.checkout textarea{
  min-height:80px;
  resize:vertical;
}

.submit{
  width:100%;
  padding:13px;
}

.submit:disabled{
  opacity:.6;
}

.note{
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

.success{
  text-align:center;
  padding:30px 10px;
}

.gallery-modal{
  z-index:9999;
  align-items:center;
  padding:20px;
}

.gallery-box{
  width:min(760px,100%);
  max-height:92vh;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.gallery-main{
  width:100%;
  max-height:70vh;
  object-fit:contain;
  border-radius:16px;
}

.gallery-close{
  position:absolute;
  top:14px;
  right:16px;
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:24px;
}

.gallery-thumbs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px;
}

.gallery-thumb{
  width:64px;
  height:64px;
  padding:0;
  border:2px solid transparent;
  border-radius:10px;
  overflow:hidden;
  background:transparent;
  flex:0 0 auto;
}

.gallery-thumb.active{
  border-color:#fff;
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

@media(min-width:650px){

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .pic{
    height:190px;
  }

  .overlay,
  .description-modal{
    align-items:center;
  }

  .sheet,
  .description-sheet{
    border-radius:24px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">
<b>SEOULDROP</b>
<span>К-ПОП МАГАЗИН</span>
</div>

<button
class="icon"
onclick="loadProducts()">
↻
</button>

</header>

<section class="hero">

<h1>
Твой K-POP из Кореи 🇰🇷
</h1>

<p>
Альбомы, карты и оригинальный мерч —
выбирай любимых артистов и собирай свою коллекцию.
</p>

<button
class="cta"
onclick="
document
.getElementById('catalog')
.scrollIntoView({
behavior:'smooth'
})
">
Смотреть каталог
</button>

</section>

<section
class="section"
id="catalog">

<div class="section-head">

<h2>
Каталог
</h2>

<span
class="muted"
id="productCount">
Загрузка...
</span>

</div>

<div class="search-wrap">

<input
id="searchInput"
class="search-input"
type="search"
placeholder="🔎 Поиск по каталогу..."
autocomplete="off">

</div>

<div class="categories">

<button class="cat active" data-category="all">
Все
</button>

<button class="cat" data-category="albums">
💿 Альбомы
</button>

<button class="cat" data-category="photocards">
🃏 Карты
</button>

<button class="cat" data-category="merch">
🎁 Мерч
</button>

<button class="cat" data-category="cosmetics">
🧴 Косметика
</button>

<button class="cat" data-category="sweets">
🍪 Сладости
</button>

<button class="cat" data-category="vinyl">
🎶 Винил
</button>

<button class="cat" data-category="other">
🌟 Другое
</button>

</div>

<div
id="products"
class="grid">

<div class="loading">
Загружаем каталог...
</div>

</div>

</section>

</div>

<nav class="bottom">

<div class="bottom-inner">

<button
class="nav active"
onclick="
window.scrollTo({
top:0,
behavior:'smooth'
})
">

<strong>⌂</strong>

Главная

</button>

<button
class="nav"
onclick="
document
.getElementById('catalog')
.scrollIntoView({
behavior:'smooth'
})
">

<strong>◈</strong>

Каталог

</button>

<button
class="nav"
onclick="showCart()">

<strong>
🛒
<span
class="badge"
id="navCount">
0
</span>
</strong>

Корзина

</button>

</div>

</nav>

<div
class="overlay"
id="cartOverlay"
onclick="
if(event.target===this)
closeCart()
">

<div class="sheet">

<div class="sheet-head">

<h2>
🛒 Корзина
</h2>

<button
class="close"
onclick="closeCart()">
✕
</button>

</div>

<div id="cartContent"></div>

</div>

</div>

<div
id="descriptionModal"
class="description-modal"
onclick="
if(event.target===this)
closeDescription()
">

<div class="description-sheet">

<div class="description-head">

<div
id="descriptionTitle"
class="description-title">
</div>

<button
class="description-close close"
onclick="closeDescription()">
×
</button>

</div>

<div
id="descriptionText"
class="description-text">
</div>

</div>

</div>

<div
id="galleryModal"
class="gallery-modal"
onclick="
if(event.target===this)
closeGallery()
">

<button
class="gallery-close"
onclick="closeGallery()">
×
</button>

<div class="gallery-box">

<img
id="galleryMainImage"
class="gallery-main"
src=""
alt="">

<div
id="galleryThumbs"
class="gallery-thumbs">
</div>

</div>

</div>

<script>

let products=[];
let cart={};
let currentCategory='all';

try{

cart=JSON.parse(
localStorage.getItem(
'seouldrop_cart'
)||'{}'
);

}catch{

cart={};

}

function getTelegramUser(){

return (
window.Telegram &&
window.Telegram.WebApp &&
window.Telegram.WebApp.initDataUnsafe &&
window.Telegram.WebApp.initDataUnsafe.user
)||null;

}

function getTelegramUsername(){

const user=getTelegramUser();

if(user && user.username){
return '@'+user.username;
}

return 'не указан';

}

function escapeHtml(value){

return String(value??'').replace(
/[&<>'"]/g,
function(c){

return {
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'
}[c];

}
);

}

function getStatus(product){

if(product.status){
return product.status;
}

if(product.available===false){
return 'out_of_stock';
}

return 'in_stock';

}

function getStock(product){

const stock=Number(product.stock);

if(!Number.isFinite(stock)||stock<0){
return 0;
}

return Math.floor(stock);

}

function getStatusText(product){

const status=getStatus(product);

if(status==='preorder'){
return '🟡 Под заказ';
}

if(status==='out_of_stock'){
return '🔴 Нет в наличии';
}

const stock=getStock(product);

if(stock>0){
return '🟢 В наличии · '+stock+' шт.';
}

return '🔴 Нет в наличии';

}

function categoryName(category){

const names={

albums:'Альбомы',
photocards:'Карты',
merch:'Мерч',
cosmetics:'Косметика',
sweets:'Сладости',
vinyl:'Винил',
other:'Другое',
'Альбомы':'Альбомы'

};

return names[category]||category||'Товар';

}

function getProductImages(product){

if(
Array.isArray(product.images)&&
product.images.length
){

return product.images.filter(Boolean);

}

return product.image
?[product.image]
:[];

}

async function loadProducts(){

const box=document.getElementById('products');

box.innerHTML=
'<div class="loading">'+
'Загружаем каталог...'+
'</div>';

const controller=new AbortController();

const timer=setTimeout(
()=>controller.abort(),
5000
);

try{

const response=await fetch(
'/api/products?action=list&_='+
Date.now(),
{
cache:'no-store',
signal:controller.signal
}
);

clearTimeout(timer);

if(!response.ok){
throw new Error(
'HTTP '+response.status
);
}

const data=await response.json();

if(
data &&
data.ok &&
Array.isArray(data.products)
){

products=data.products;

}else{

throw new Error(
'Неверный ответ API'
);

}

renderProducts();

}catch(error){

clearTimeout(timer);

products=[];

renderProducts();

}

}

let galleryImages=[];
let galleryIndex=0;

function openGallery(
images,
index=0
){

galleryImages=
Array.isArray(images)
?images.filter(Boolean)
:[];

if(!galleryImages.length)
return;

galleryIndex=Math.max(
0,
Math.min(
index,
galleryImages.length-1
)
);

document
.getElementById('galleryModal')
.classList.add('show');

setGalleryImage(
galleryIndex
);

}

function setGalleryImage(index){

if(!galleryImages.length)
return;

galleryIndex=Math.max(
0,
Math.min(
index,
galleryImages.length-1
)
);

const main=document.getElementById(
'galleryMainImage'
);

const thumbs=document.getElementById(
'galleryThumbs'
);

if(main){

main.src=
galleryImages[
galleryIndex
];

}

if(thumbs){

thumbs.innerHTML=
galleryImages.map(
(src,i)=>`

<button
class="gallery-thumb ${
i===galleryIndex?'active':''
}"
onclick="setGalleryImage(${i})">

<img
src="${escapeHtml(src)}"
alt="">

</button>

`
).join('');

}

}

function closeGallery(){

document
.getElementById('galleryModal')
.classList.remove(
'show'
);

}

function openDescription(product){

const modal=
document.getElementById(
'descriptionModal'
);

const title=
document.getElementById(
'descriptionTitle'
);

const text=
document.getElementById(
'descriptionText'
);

title.textContent=
product.name||
'Товар';

text.textContent=
String(
product.description||
''
).trim()||
'Описание товара пока не добавлено.';

modal.classList.add(
'show'
);

}

function closeDescription(){

document
.getElementById(
'descriptionModal'
)
.classList.remove(
'show'
);

}

function renderProducts(){

const search=
(
document.getElementById(
'searchInput'
).value||''
)
.trim()
.toLowerCase();

const list=
products.filter(
product=>{

const category=
product.category||'';

const categoryOk=
currentCategory==='all'||
category===currentCategory||
(
currentCategory==='albums'&&
category==='Альбомы'
);

if(!categoryOk)
return false;

const haystack=[

product.name,
product.title,
product.description,
product.artist,
product.group,
product.category

]
.filter(Boolean)
.join(' ')
.toLowerCase();

return !search||
haystack.includes(search);

}
);

document.getElementById(
'productCount'
).textContent=
products.length+
' товар'+
(
products.length===1
?''
:'а'
);

const box=
document.getElementById(
'products'
);

if(!list.length){

box.innerHTML=
'<div class="empty">'+
'Товаров не найдено.'+
'</div>';

return;

}

box.innerHTML='';

list.forEach(
product=>{

const status=
getStatus(product);

const stock=
getStock(product);

const disabled=
status==='out_of_stock'||
(
status==='in_stock'&&
stock<=0
);

const images=
getProductImages(product);

const card=
document.createElement(
'article'
);

card.className='card';

let image='';

if(images.length){

image=
'<img src="'+
escapeHtml(images[0])+
'" alt="">';

}else{

image=
'<div class="placeholder">'+
'💿'+
'</div>';

}

let statusClass='green';

if(status==='preorder'){
statusClass='yellow';
}

if(disabled){
statusClass='red';
}

let buttonText='';

if(status==='preorder'){

buttonText='＋ Заказать';

}else if(disabled){

buttonText='Нет в наличии';

}else{

buttonText='＋ В корзину';

}

/* ВОТ ЗДЕСЬ ОПИСАНИЕ ВЫВОДИТСЯ ПРЯМО В КАРТОЧКЕ */

card.innerHTML=`

<div class="pic
