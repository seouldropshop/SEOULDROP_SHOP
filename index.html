<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOULDROP | K-POP SHOP</title>

<style>
:root{
  --bg:#050308;
  --panel:#0e0912;
  --panel2:#160d1b;
  --pink:#ff4fb3;
  --violet:#a76cff;
  --text:#fff7fc;
  --muted:#bcaabd;
  --line:rgba(255,111,194,.18);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 5%,rgba(255,79,179,.14),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(167,108,255,.14),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;
}

button,input,textarea{font:inherit}

.app{
  max-width:760px;
  margin:auto;
  padding:16px 14px 92px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.brand b{
  font-size:16px;
  letter-spacing:.14em;
}

.brand span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.icon,.cat,.nav,.add,.qty button,.close{
  border:1px solid var(--line);
  background:var(--panel);
  color:#fff;
  border-radius:14px;
  cursor:pointer;
}

.icon{padding:10px 12px}

.hero{
  border:1px solid var(--line);
  border-radius:26px;
  padding:24px 20px;
  background:linear-gradient(
    135deg,
    rgba(255,79,179,.12),
    rgba(167,108,255,.08) 55%,
    rgba(0,0,0,.2)
  );
}

.hero h1{
  margin:0;
  font-size:28px;
  line-height:1.05;
}

.hero p{
  color:var(--muted);
  max-width:430px;
  margin:10px 0 16px;
}

.cta{
  background:linear-gradient(90deg,var(--pink),var(--violet));
  border:0;
  color:#fff;
  font-weight:800;
  border-radius:14px;
  padding:12px 18px;
  cursor:pointer;
}

.section{margin-top:22px}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section h2{
  font-size:18px;
  margin:0;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.categories{
  display:flex;
  gap:9px;
  overflow:auto;
  padding-bottom:3px;
}

.cat{
  white-space:nowrap;
  padding:9px 13px;
}

.cat.active{
  background:rgba(255,79,179,.15);
  border-color:rgba(255,145,209,.55);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:12px;
}

.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden;
}

.pic{
  height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,rgba(255,79,179,.18),transparent 52%),
    #09050b;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:12px;
}

.placeholder{font-size:48px}

.info{padding:12px}

.name{
  font-weight:750;
  font-size:14px;
  min-height:38px;
}

.meta{
  color:var(--muted);
  font-size:11px;
  margin:4px 0 9px;
}

.price{
  font-size:17px;
  font-weight:850;
}

.status{
  font-size:12px;
  margin-top:5px;
  min-height:18px;
}

.green{color:#53e69a}
.yellow{color:#ffd34d}
.red{color:#ff667f}

.add{
  width:100%;
  margin-top:9px;
  padding:9px;
  background:rgba(255,79,179,.1);
  border-color:rgba(255,145,209,.32);
}

.add.preorder{
  background:rgba(255,211,77,.1);
  border-color:rgba(255,211,77,.35);
}

.add.disabled{
  opacity:.45;
  cursor:not-allowed;
}

.empty,.loading{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 14px;
  background:rgba(5,3,8,.9);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:20;
}

.bottom-inner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.nav{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  font-size:11px;
}

.nav.active{color:#fff}

.nav strong{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.badge{
  display:inline-flex;
  min-width:18px;
  height:18px;
  border-radius:9px;
  align-items:center;
  justify-content:center;
  background:var(--pink);
  font-size:10px;
  margin-left:3px;
}

/* КОРЗИНА */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:50;
  align-items:flex-end;
  justify-content:center;
}

.overlay.open{display:flex}

.sheet{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0c0710;
  border:1px solid var(--line);
  border-radius:24px 24px 0 0;
  padding:18px 16px 28px;
}

.sheet-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sheet h2{margin:0}

.close{padding:8px 12px}

.cart-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.cart-name{font-weight:700}

.cart-price{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:32px;
  height:32px;
  border-radius:10px;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:850;
  padding:16px 0;
}

.checkout{
  display:grid;
  gap:10px;
}

.checkout input,
.checkout textarea{
  width:100%;
  background:#09050b;
  color:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  outline:none;
}

.checkout textarea{
  min-height:80px;
  resize:vertical;
}

.submit{
  border:0;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  color:#fff;
  font-weight:800;
  border-radius:14px;
  padding:13px;
  cursor:pointer;
}

.note{
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

.success{
  text-align:center;
  padding:30px 10px;
}

.success b{font-size:20px}

@media(min-width:650px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .pic{height:190px}

  .overlay{align-items:center}

  .sheet{
    border-radius:24px;
    max-height:88vh;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">
<b>SEOULDROP</b>
<span>K-POP SHOP</span>
</div>

<button class="icon" onclick="loadProducts()">↻</button>

</header>


<section class="hero">

<h1>Твой K-POP из Кореи 🇰🇷</h1>

<p>
Альбомы, photocards и оригинальный merch —
выбирай любимых артистов и собирай свою коллекцию.
</p>

<button
class="cta"
onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">
Смотреть каталог
</button>

</section>


<section class="section" id="catalog">

<div class="section-head">

<h2>Каталог</h2>

<span class="muted" id="productCount">
Загрузка...
</span>

</div>


<div class="categories">

<button class="cat active" data-category="all">
Все
</button>

<button class="cat" data-category="albums">
💿 Альбомы
</button>

<button class="cat" data-category="photocards">
🃏 Photocards
</button>

<button class="cat" data-category="merch">
🎁 Merch
</button>

<button class="cat" data-category="cosmetics">
🧴 Косметика
</button>

<button class="cat" data-category="sweets">
🍪 Сладости
</button>

</div>


<div id="products" class="grid">

<div class="loading">
Загружаем каталог...
</div>

</div>

</section>

</div>


<nav class="bottom">

<div class="bottom-inner">

<button
class="nav active"
onclick="window.scrollTo({top:0,behavior:'smooth'})">

<strong>⌂</strong>
Главная

</button>


<button
class="nav"
onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">

<strong>◈</strong>
Каталог

</button>


<button
class="nav"
onclick="showCart()">

<strong>
🛒
<span class="badge" id="navCount">0</span>
</strong>

Корзина

</button>

</div>

</nav>


<!-- КОРЗИНА -->

<div
class="overlay"
id="cartOverlay"
onclick="if(event.target===this)closeCart()">

<div class="sheet">

<div class="sheet-head">

<h2>🛒 Корзина</h2>

<button class="close" onclick="closeCart()">
✕
</button>

</div>

<div id="cartContent"></div>

</div>

</div>


<script>

let products=[];

let cart={};

try{
  cart=JSON.parse(
    localStorage.getItem('seouldrop_cart')||'{}'
  );
}catch{
  cart={};
}

let currentCategory='all';


/* РЕЗЕРВНЫЕ ТОВАРЫ */

const FALLBACK_PRODUCTS=[

{
  id:'dynamite',
  name:'BTS — DYNAMITE',
  price:5000,
  category:'albums',
  description:'BTS — DYNAMITE',
  available:true,
  status:'preorder',
  image:''
},

{
  id:'ynwa',
  name:'BTS — You Never Walk Alone',
  price:1925,
  category:'albums',
  description:'BTS — You Never Walk Alone',
  available:true,
  image:''
},

{
  id:'butter',
  name:'BTS — Butter',
  price:3335,
  category:'albums',
  description:'BTS — Butter',
  available:true,
  image:''
}

];


/* КОРЗИНА */

function saveCart(){

localStorage.setItem(
'seouldrop_cart',
JSON.stringify(cart)
);

updateCount();

}


function updateCount(){

const el=document.getElementById('navCount');

if(!el)return;

el.textContent=
Object.values(cart).reduce(
(a,b)=>a+Number(b||0),
0
);

}


/* СТАТУС */

function getStatus(product){

if(product.status){
return product.status;
}

if(product.available===false){
return 'out_of_stock';
}

return 'in_stock';

}


function getStatusText(product){

const status=getStatus(product);

if(status==='preorder'){
return '🟡 Под заказ';
}

if(status==='out_of_stock'){
return '🔴 Нет в наличии';
}

return '🟢 В наличии';

}


/* КАТЕГОРИЯ */

function categoryName(category){

const names={
albums:'Альбом',
photocards:'Photocards',
merch:'Merch',
cosmetics:'Косметика',
sweets:'Сладости',
'Альбомы':'Альбомы'
};

return names[category]||category||'Товар';

}


/* БЕЗОПАСНЫЙ HTML */

function escapeHtml(value){

return String(value??'')
.replace(/[&<>'"]/g,function(c){

return{
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'
}[c];

});

}


/* ЗАГРУЗКА КАТАЛОГА */

async function loadProducts(){

const box=document.getElementById('products');

box.innerHTML=
'<div class="loading">Загружаем каталог...</div>';


/*
ВАЖНО:
если Cloudflare/KV не ответит за 5 секунд,
каталог всё равно откроется.
*/

const controller=new AbortController();

const timer=setTimeout(
()=>controller.abort(),
5000
);


try{

const response=await fetch(
'/api/products?action=list&_='+
Date.now(),
{
cache:'no-store',
signal:controller.signal
}
);

clearTimeout(timer);


if(!response.ok){
throw new Error('HTTP '+response.status);
}


const data=await response.json();


if(
data &&
data.ok &&
Array.isArray(data.products)
){

products=data.products;

}else{

throw new Error('Неверный ответ API');

}


renderProducts();


}catch(error){

clearTimeout(timer);

/*
Резервный список.
Он нужен только если API временно недоступен.
*/

products=FALLBACK_PRODUCTS;

renderProducts();

document.getElementById(
'productCount'
).textContent=
products.length+' товара';

}

}


/* ОТРИСОВКА */

function renderProducts(){

const box=document.getElementById('products');

const list=products.filter(product=>{

if(currentCategory==='all'){
return true;
}

return(
product.category===currentCategory ||
(
currentCategory==='albums' &&
product.category==='Альбомы'
)
);

});


document.getElementById(
'productCount'
).textContent=
products.length+
' товар'+
(
products.length===1
?''
:'а'
);


if(!list.length){

box.innerHTML=
'<div class="empty">'+
'В этой категории пока нет товаров.'+
'</div>';

return;

}


box.innerHTML='';


list.forEach(product=>{

const status=getStatus(product);

const disabled=status==='out_of_stock';

const card=document.createElement('article');

card.className='card';


let image='';

if(product.image){

image=
'<img src="'+
escapeHtml(product.image)+
'" alt="">';

}else{

image='<div class="placeholder">💿</div>';

}


card.innerHTML=`

<div class="pic">
${image}
</div>

<div class="info">

<div class="name">
${escapeHtml(product.name||'Товар')}
</div>

<div class="meta">
${escapeHtml(categoryName(product.category))}
</div>

<div class="price">
${Number(product.price||0).toLocaleString('ru-RU')} ₽
</div>

<div class="status ${
status==='preorder'
?'yellow'
:
status==='out_of_stock'
?'red'
:'green'
}">
${getStatusText(product)}
</div>

<button
class="add ${
status==='preorder'?'preorder':''
}"
${disabled?'disabled':''}>

${
disabled
?'Нет в наличии'
:
status==='preorder'
?'＋ Заказать'
:'＋ В корзину'
}

</button>

</div>
`;


const button=card.querySelector('.add');

if(!disabled){

button.addEventListener(
'click',
()=>addToCart(product.id)
);

}


box.appendChild(card);

});

}


/* ДОБАВЛЕНИЕ */

function addToCart(id){

const product=products.find(
item=>String(item.id)===String(id)
);

if(
!product ||
getStatus(product)==='out_of_stock'
){
return;
}


cart[id]=(cart[id]||0)+1;

saveCart();

/*
КОРЗИНА НЕ ОТКРЫВАЕТСЯ.
Покупатель продолжает выбирать товары.
*/

}


/* КОЛИЧЕСТВО */

function changeQty(id,difference){

const newQuantity=
(cart[id]||0)+difference;


if(newQuantity<=0){

delete cart[id];

}else{

cart[id]=newQuantity;

}


saveCart();

renderCart();

}


/* ОТКРЫТЬ КОРЗИНУ */

function showCart(){

renderCart();

document
.getElementById('cartOverlay')
.classList.add('open');

}


/* ЗАКРЫТЬ */

function closeCart(){

document
.getElementById('cartOverlay')
.classList.remove('open');

}


/* КОРЗИНА */

function renderCart(){

const box=
document.getElementById('cartContent');


const items=
Object.entries(cart)
.map(([id,quantity])=>({

product:products.find(
item=>String(item.id)===String(id)
),

quantity:Number(quantity)

}))
.filter(item=>item.product);


if(!items.length){

box.innerHTML=
'<div class="empty">'+
'Корзина пока пуста.<br>'+
'Добавьте товары из каталога.'+
'</div>';

return;

}


const total=
items.reduce(
(sum,item)=>
sum+
Number(item.product.price||0)*
item.quantity,
0
);


let html='';


items.forEach(item=>{

html+=`

<div class="cart-item">

<div>

<div class="cart-name">
${escapeHtml(item.product.name)}
</div>

<div class="cart-price">
${Number(item.product.price||0).toLocaleString('ru-RU')}
 ₽ × ${item.quantity}
</div>

</div>


<div class="qty">

<button
data-minus="${escapeHtml(item.product.id)}">
−
</button>

<b>${item.quantity}</b>

<button
data-plus="${escapeHtml(item.product.id)}">
+
</button>

</div>

</div>

`;

});


html+=`

<div class="total">

<span>Итого</span>

<span>
${total.toLocaleString('ru-RU')} ₽
</span>

</div>


<div class="checkout">

<input
id="orderName"
placeholder="Ваше имя *">

<input
id="orderPhone"
placeholder="Телефон *"
type="tel">

<textarea
id="orderAddress"
placeholder="Адрес доставки *"></textarea>

<textarea
id="orderComment"
placeholder="Комментарий к заказу"></textarea>

<button
class="submit"
onclick="submitOrder()">

Оформить заказ

</button>


<div class="note">

🚚 Доставка рассчитывается отдельно.<br>
Оплата сейчас не производится.<br>
После отправки заказа мы свяжемся с вами для подтверждения.

</div>

</div>

`;


box.innerHTML=html;


/* КНОПКИ + И − */

box.querySelectorAll('[data-minus]')
.forEach(button=>{

button.onclick=()=>changeQty(
button.dataset.minus,
-1
);

});


box.querySelectorAll('[data-plus]')
.forEach(button=>{

button.onclick=()=>changeQty(
button.dataset.plus,
1
);

});

}


/* ОФОРМЛЕНИЕ */

async function submitOrder(){

const name=
document.getElementById('orderName')
.value.trim();

const phone=
document.getElementById('orderPhone')
.value.trim();

const address=
document.getElementById('orderAddress')
.value.trim();

const comment=
document.getElementById('orderComment')
.value.trim();


const items=
Object.entries(cart)
.map(([id,quantity])=>{

const product=products.find(
item=>String(item.id)===String(id)
);

if(!product)return null;

return{

имя:product.name,

цена:Number(product.price||0),

количество:Number(quantity)

};

})
.filter(Boolean);


const total=
items.reduce(
(sum,item)=>
sum+
item.цена*
item.количество,
0
);


if(
!name||
!phone||
!address||
!items.length
){

alert(
'Заполните имя, телефон и адрес.'
);

return;

}


const button=
document.querySelector('.submit');

button.disabled=true;

button.textContent=
'Отправляем заказ...';


try{

const telegramUser=
window.Telegram?.WebApp
?.initDataUnsafe?.user
||null;


const response=
await fetch(
'/api/create-order',
{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

имя:name,

телефон:phone,

адрес:address,

комментарий:comment,

предметы:items,

общий:total,

telegramUser:
telegramUser
?
{
имя_пользователя:
telegramUser.username,

имя:
telegramUser.first_name
}
:null

})

}
);


const data=await response.json();


if(
!response.ok ||
!data.хорошо
){

throw new Error(
data.ошибка||
'Не удалось отправить заказ'
);

}


cart={};

saveCart();


document.getElementById(
'cartContent'
).innerHTML=`

<div class="success">

<b>
✅ Заказ отправлен!
</b>

<p class="note">
Мы получили ваш заказ и свяжемся с вами для подтверждения.
</p>

<button
class="submit"
onclick="closeCart()">

Вернуться в каталог

</button>

</div>

`;


}catch(error){

button.disabled=false;

button.textContent=
'Оформить заказ';

alert(
error.message||
'Не удалось отправить заказ'
);

}

}


/* КАТЕГОРИИ */

document
.querySelectorAll('.cat')
.forEach(button=>{

button.addEventListener(
'click',
()=>{

document
.querySelectorAll('.cat')
.forEach(item=>
item.classList.remove('active')
);

button.classList.add('active');

currentCategory=
button.dataset.category;

renderProducts();

}
);

});


/* СТАРТ */

updateCount();

loadProducts();

</script>

</body>
</html>
