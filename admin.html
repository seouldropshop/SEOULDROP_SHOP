<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEOULDROP | Админка</title>

<style>
:root{
  --bg:#050308;
  --panel:#0e0912;
  --panel2:#160d1b;
  --pink:#ff4fb3;
  --violet:#a76cff;
  --text:#fff7fc;
  --muted:#bcaabd;
  --line:rgba(255,111,194,.18)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 5%,rgba(255,79,179,.14),transparent 28%),
    radial-gradient(circle at 90% 20%,rgba(167,108,255,.14),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px 14px 50px
}

.brand{
  font-weight:900;
  letter-spacing:.12em;
  font-size:20px;
  margin-bottom:4px
}

.muted{color:var(--muted)}

.panel{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-top:16px
}

.input,select,textarea{
  width:100%;
  background:#0b0610;
  color:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  font:inherit;
  margin-top:6px
}

select option{
  background:#0b0610;
  color:#fff
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  background:linear-gradient(90deg,var(--pink),var(--violet));
  color:white;
  font-weight:800;
  cursor:pointer
}

.btn.secondary{
  background:var(--panel);
  border:1px solid var(--line)
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between
}

.products{
  display:grid;
  gap:12px
}

.product{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:12px;
  align-items:center;
  background:#0b0610;
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px
}

.product img{
  width:70px;
  height:70px;
  object-fit:contain;
  border-radius:10px;
  background:#050308
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.login{
  max-width:430px;
  margin:12vh auto
}

.hidden{display:none}

.formgrid{
  display:grid;
  gap:10px
}

.preview{
  max-width:120px;
  max-height:120px;
  border-radius:12px;
  display:none;
  margin-top:8px
}

.status{
  margin-top:5px;
  font-size:14px
}

.stock{
  margin-top:5px;
  font-size:14px;
  color:#fff
}

.stock-input{
  width:100%;
  background:#0b0610;
  color:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  font:inherit;
  margin-top:6px
}

.stock-note{
  margin-top:5px;
  font-size:13px;
  color:var(--muted)
}
</style>
</head>

<body>

<div class="wrap">

<div class="brand">SEOULDROP</div>
<div class="muted">Админка каталога</div>

<section id="login" class="panel login">

<h2>🔐 Вход</h2>

<input
  class="input"
  id="password"
  type="password"
  placeholder="Пароль администратора"
>

<button
  class="btn"
  style="width:100%;margin-top:12px"
  onclick="login()"
>
Войти
</button>

<div
  id="loginError"
  class="muted"
  style="margin-top:10px"
></div>

</section>

<main id="app" class="hidden">

<div class="row" style="margin-top:18px">

<h2 style="margin:0">Товары</h2>

<button
  class="btn"
  onclick="newProduct()"
>
＋ Добавить
</button>

</div>

<div
  id="products"
  class="products"
  style="margin-top:12px"
></div>

<div
  class="row"
  style="margin-top:16px"
>

<button
  class="btn"
  onclick="saveAll()"
>
💾 Сохранить изменения
</button>

<button
  class="btn secondary"
  onclick="logout()"
>
Выйти
</button>

</div>

<section
  id="editor"
  class="panel hidden"
>

<div class="row">

<h2
  id="editorTitle"
  style="margin:0"
>
Товар
</h2>

<button
  class="btn secondary"
  onclick="closeEditor()"
>
✕
</button>

</div>

<div
  class="formgrid"
  style="margin-top:12px"
>

<label>
Название

<input
  class="input"
  id="fName"
>
</label>

<label>
Цена

<input
  class="input"
  id="fPrice"
  type="number"
  min="0"
>
</label>

<label>
Категория

<select
  class="input"
  id="fCategory"
>

<option value="albums">
💿 Альбомы
</option>

<option value="photocards">
🃏 Photocards
</option>

<option value="merch">
🎁 Merch
</option>

<option value="cosmetics">
🧴 Косметика
</option>

<option value="sweets">
🍪 Сладости
</option>

</select>

</label>

<label>
Описание

<textarea
  class="input"
  id="fDesc"
  rows="3"
></textarea>

</label>

<label>
Статус товара

<select
  class="input"
  id="fStatus"
  onchange="toggleStockField()"
>

<option value="in_stock">
🟢 В наличии
</option>

<option value="preorder">
🟡 Под заказ
</option>

<option value="out_of_stock">
🔴 Нет в наличии
</option>

</select>

</label>

<!-- КОЛИЧЕСТВО -->

<div id="stockBlock">

<label>
Количество в наличии

<input
  class="stock-input"
  id="fStock"
  type="number"
  min="0"
  step="1"
  value="0"
>

</label>

<div class="stock-note">
Укажи количество штук товара на складе.
</div>

</div>

<label>
Фото

<input
  class="input"
  id="fImage"
  type="file"
  accept="image/*"
>

<img
  id="preview"
  class="preview"
>

</label>

<button
  class="btn"
  onclick="applyEditor()"
>
Готово
</button>

</div>

</section>

</main>

</div>

<script>

let products = [];
let editing = null;
let imageData = null;
let adminPassword = "";


/* API */

async function api(action, body = {}) {

  let url = "/api/products?action=" +
    encodeURIComponent(action);

  const options = {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Password": adminPassword
    },
    body: JSON.stringify({
      ...body,
      action: action
    })
  };

  const response =
    await fetch(url, options);

  const data =
    await response
      .json()
      .catch(() => ({
        error: "Ошибка ответа сервера"
      }));

  if (!response.ok) {
    throw new Error(
      data.error || "Ошибка"
    );
  }

  return data;
}


/* LOGIN */

async function login() {

  const password =
    document
      .getElementById("password")
      .value
      .trim();

  if (!password) {

    document
      .getElementById("loginError")
      .textContent =
      "Введите пароль";

    return;
  }

  try {

    adminPassword = password;

    const data =
      await api(
        "login",
        {
          password: password
        }
      );

    if (!data.ok) {
      throw new Error(
        data.error ||
        "Ошибка входа"
      );
    }

    await load();

    document
      .getElementById("login")
      .classList
      .add("hidden");

    document
      .getElementById("app")
      .classList
      .remove("hidden");

  } catch (error) {

    adminPassword = "";

    document
      .getElementById("loginError")
      .textContent =
      error.message;
  }
}


/* LOAD */

async function load() {

  const data =
    await api("list");

  products =
    Array.isArray(data.products)
      ? data.products
      : [];

  render();
}


/* STATUS */

function getStatus(product) {

  if (product.status) {
    return product.status;
  }

  return product.available === false
    ? "out_of_stock"
    : "in_stock";
}


function getStatusText(product) {

  const status =
    getStatus(product);

  if (status === "preorder") {
    return "🟡 Под заказ";
  }

  if (status === "out_of_stock") {
    return "🔴 Нет в наличии";
  }

  return "🟢 В наличии";
}


/* STOCK */

function getStock(product) {

  const stock =
    Number(product.stock);

  if (
    !Number.isFinite(stock) ||
    stock < 0
  ) {
    return 0;
  }

  return Math.floor(stock);
}


function getStockText(product) {

  const status =
    getStatus(product);

  if (status === "preorder") {
    return "";
  }

  if (status === "out_of_stock") {
    return "";
  }

  return ` · ${getStock(product)} шт.`;
}


/* RENDER */

function render() {

  const box =
    document
      .getElementById("products");

  box.innerHTML = "";

  products.forEach(
    (product, index) => {

      const element =
        document
          .createElement("div");

      element.className =
        "product";

      const stockText =
        getStockText(product);

      element.innerHTML = `

        <img
          src="${product.image || ""}"
          onerror="
            this.style.visibility='hidden'
          "
        >

        <div>

          <b>
            ${esc(product.name)}
          </b>

          <div class="muted">

            ${Number(product.price)
              .toLocaleString("ru-RU")} ₽

          </div>

          <div class="status">

            ${getStatusText(product)}${stockText}

          </div>

        </div>

        <div class="actions">

          <button
            class="btn secondary"
            onclick="edit(${index})"
          >
            Изменить
          </button>

          <button
            class="btn secondary"
            onclick="
              removeProduct(${index})
            "
          >
            Удалить
          </button>

        </div>
      `;

      box.appendChild(element);

    }
  );
}


/* ESCAPE */

function esc(value) {

  return String(value || "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char])
    );
}


/* NEW */

function newProduct() {

  editing = null;
  imageData = null;

  document
    .getElementById("editorTitle")
    .textContent =
    "Новый товар";

  fill({
    name: "",
    price: 0,
    category: "albums",
    description: "",
    status: "in_stock",
    stock: 0,
    image: null
  });

  document
    .getElementById("editor")
    .classList
    .remove("hidden");

  toggleStockField();
}


/* EDIT */

function edit(index) {

  editing = index;
  imageData = null;

  document
    .getElementById("editorTitle")
    .textContent =
    "Изменить товар";

  fill(products[index]);

  document
    .getElementById("editor")
    .classList
    .remove("hidden");

  toggleStockField();
}


/* FILL */

function fill(product) {

  document
    .getElementById("fName")
    .value =
    product.name || "";

  document
    .getElementById("fPrice")
    .value =
    product.price || 0;

  document
    .getElementById("fCategory")
    .value =
    product.category || "albums";

  document
    .getElementById("fDesc")
    .value =
    product.description || "";

  document
    .getElementById("fStatus")
    .value =
    getStatus(product);

  document
    .getElementById("fStock")
    .value =
    getStock(product);

  const preview =
    document.getElementById("preview");

  preview.src =
    product.image || "";

  preview.style.display =
    product.image
      ? "block"
      : "none";

  document
    .getElementById("fImage")
    .value = "";
}


/* SHOW / HIDE STOCK */

function toggleStockField() {

  const status =
    document
      .getElementById("fStatus")
      .value;

  const block =
    document
      .getElementById("stockBlock");

  if (status === "in_stock") {

    block.style.display =
      "block";

  } else {

    block.style.display =
      "none";
  }
}


/* CLOSE */

function closeEditor() {

  document
    .getElementById("editor")
    .classList
    .add("hidden");
}


/* IMAGE */

document
  .getElementById("fImage")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      if (!file) return;

      const reader =
        new FileReader();

      reader.onload =
        function() {

          imageData =
            reader.result;

          const preview =
            document
              .getElementById("preview");

          preview.src =
            imageData;

          preview.style.display =
            "block";
        };

      reader.readAsDataURL(file);
    }
  );


/* APPLY */

function applyEditor() {

  const old =
    editing === null
      ? null
      : products[editing];

  const status =
    document
      .getElementById("fStatus")
      .value;

  let stock = 0;

  /*
   * Количество только для
   * "В наличии".
   *
   * Для "Под заказ" и
   * "Нет в наличии" всегда 0.
   */
  if (status === "in_stock") {

    stock =
      Number(
        document
          .getElementById("fStock")
          .value
      ) || 0;

    stock =
      Math.max(
        0,
        Math.floor(stock)
      );

    /*
     * Если количество 0,
     * автоматически ставим
     * "Нет в наличии".
     */
    if (stock === 0) {
      stock = 0;
    }

  } else {

    stock = 0;
  }

  let finalStatus = status;

  /*
   * Если "В наличии", но
   * количество 0 — автоматически
   * переводим в "Нет в наличии".
   */
  if (
    status === "in_stock" &&
    stock === 0
  ) {
    finalStatus =
      "out_of_stock";
  }

  const product = {

    id:
      old?.id ||
      "p_" + Date.now(),

    name:
      document
        .getElementById("fName")
        .value
        .trim() ||
      "Без названия",

    price:
      Number(
        document
          .getElementById("fPrice")
          .value
      ) || 0,

    category:
      document
        .getElementById("fCategory")
        .value,

    description:
      document
        .getElementById("fDesc")
        .value
        .trim(),

    status:
      finalStatus,

    stock:
      stock,

    available:
      finalStatus !== "out_of_stock",

    image:
      imageData !== null
        ? imageData
        : (old?.image || null)
  };

  if (editing === null) {

    products.push(product);

  } else {

    products[editing] =
      product;
  }

  render();
  closeEditor();
}


/* DELETE */

function removeProduct(index) {

  if (
    confirm(
      "Удалить этот товар?"
    )
  ) {

    products.splice(index, 1);

    render();
  }
}


/* SAVE */

async function saveAll() {

  try {

    const data =
      await api(
        "save",
        {
          products: products
        }
      );

    if (!data.ok) {

      throw new Error(
        data.error ||
        "Не удалось сохранить"
      );
    }

    products =
      Array.isArray(data.products)
        ? data.products
        : products;

    render();

    alert(
      "Изменения сохранены 💜"
    );

  } catch (error) {

    alert(
      "Ошибка сохранения: " +
      error.message
    );
  }
}


/* LOGOUT */

function logout() {

  adminPassword = "";

  location.reload();
}

</script>

</body>
</html>
