<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEOULDROP | Админка</title><style>
:root{--bg:#050308;--panel:#0e0912;--panel2:#160d1b;--pink:#ff4fb3;--violet:#a76cff;--text:#fff7fc;--muted:#bcaabd;--line:rgba(255,111,194,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 5%,rgba(255,79,179,.14),transparent 28%),radial-gradient(circle at 90% 20%,rgba(167,108,255,.14),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 14px 50px}.brand{font-weight:900;letter-spacing:.12em;font-size:20px;margin-bottom:4px}.muted{color:var(--muted)}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.input,select,textarea{width:100%;background:#0b0610;color:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit;margin-top:6px}.btn{border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(90deg,var(--pink),var(--violet));color:white;font-weight:800;cursor:pointer}.btn.secondary{background:var(--panel);border:1px solid var(--line)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.products{display:grid;gap:12px}.product{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;background:#0b0610;border:1px solid var(--line);border-radius:16px;padding:10px}.product img{width:70px;height:70px;object-fit:contain;border-radius:10px;background:#050308}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:430px;margin:12vh auto}.hidden{display:none}.formgrid{display:grid;gap:10px}.check{display:flex;align-items:center;gap:8px;margin-top:8px}.preview{max-width:120px;max-height:120px;border-radius:12px;display:none;margin-top:8px}
</style></head><body><div class="wrap"><div class="brand">SEOULDROP</div><div class="muted">Админка каталога</div><section id="login" class="panel login"><h2>🔐 Вход</h2><input class="input" id="password" type="password" placeholder="Пароль администратора"><button class="btn" style="width:100%;margin-top:12px" onclick="login()">Войти</button><div id="loginError" class="muted" style="margin-top:10px"></div></section><main id="app" class="hidden"><div class="row" style="margin-top:18px"><h2 style="margin:0">Товары</h2><button class="btn" onclick="newProduct()">＋ Добавить</button></div><div id="products" class="products" style="margin-top:12px"></div><div class="row" style="margin-top:16px"><button class="btn" onclick="saveAll()">💾 Сохранить изменения</button><button class="btn secondary" onclick="logout()">Выйти</button></div><section id="editor" class="panel hidden"><div class="row"><h2 id="editorTitle" style="margin:0">Товар</h2><button class="btn secondary" onclick="closeEditor()">✕</button></div><div class="formgrid" style="margin-top:12px"><label>Название<input class="input" id="fName"></label><label>Цена<input class="input" id="fPrice" type="number" min="0"></label><label>Категория<select class="input" id="fCategory"><option value="albums">💿 Альбомы</option><option value="photocards">🃏 Photocards</option><option value="merch">🎁 Merch</option><option value="cosmetics">🧴 Косметика</option><option value="sweets">🍪 Сладости</option></select></label><label>Описание<textarea class="input" id="fDesc" rows="3"></textarea></label><label class="check"><input id="fAvailable" type="checkbox"> В наличии</label><label>Фото<input class="input" id="fImage" type="file" accept="image/*"><img id="preview" class="preview"></label><button class="btn" onclick="applyEditor()">Готово</button></div></section></main></div><script>
let products=[],editing=null,imageData=null;
async function api(action,body){const r=await fetch('/.netlify/functions/products?action='+encodeURIComponent(action),{method:action==='list'?'GET':'POST',headers:{'Content-Type':'application/json'},body:action==='list'?undefined:JSON.stringify(body||{})});const d=await r.json().catch(()=>({error:'Ошибка ответа'}));if(!r.ok)throw new Error(d.error||'Ошибка');return d;}
async function login(){const p=document.getElementById('password').value;try{await api('login',{password:p});document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load();}catch(e){document.getElementById('loginError').textContent=e.message}}
async function load(){try{const d=await api('list');products=d.products||[];render();}catch(e){alert(e.message)}}
function render(){const box=document.getElementById('products');box.innerHTML='';products.forEach((p,i)=>{const el=document.createElement('div');el.className='product';el.innerHTML=`<img src="${p.image||''}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><div class="muted">${Number(p.price).toLocaleString('ru-RU')} ₽ · ${p.available?'🟢 В наличии':'🔴 Нет в наличии'}</div></div><div class="actions"><button class="btn secondary" onclick="edit(${i})">Изменить</button><button class="btn secondary" onclick="removeProduct(${i})">Удалить</button></div>`;box.appendChild(el)});}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newProduct(){editing=null;imageData=null;document.getElementById('editorTitle').textContent='Новый товар';fill({name:'',price:0,category:'albums',description:'',available:true,image:null});document.getElementById('editor').classList.remove('hidden')}
function edit(i){editing=i;imageData=null;document.getElementById('editorTitle').textContent='Изменить товар';fill(products[i]);document.getElementById('editor').classList.remove('hidden')}
function fill(p){fName.value=p.name||'';fPrice.value=p.price||0;fCategory.value=p.category||'albums';fDesc.value=p.description||'';fAvailable.checked=!!p.available;preview.src=p.image||'';preview.style.display=p.image?'block':'none';fImage.value=''}
function closeEditor(){document.getElementById('editor').classList.add('hidden')}
fImage.addEventListener('change',()=>{const f=fImage.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;preview.src=imageData;preview.style.display='block'};r.readAsDataURL(f)});
function applyEditor(){const old=editing===null?null:products[editing];const p={id:old?.id||('p_'+Date.now()),name:fName.value.trim()||'Без названия',price:Number(fPrice.value)||0,category:fCategory.value,description:fDesc.value.trim(),available:fAvailable.checked,image:imageData!==null?imageData:(old?.image||null)};if(editing===null)products.push(p);else products[editing]=p;render();closeEditor()}
function removeProduct(i){if(confirm('Удалить этот товар?')){products.splice(i,1);render()}}
async function saveAll(){try{await api('save',{products});alert('Изменения сохранены 💜');}catch(e){alert(e.message)}}
async function logout(){try{await api('logout',{});}catch(e){}location.reload()}
</script></body></html>
